language: "en"

intents:
  PocketMoneyAddFunds:
    data:
      # [(pounds|pound|lbs|quid)] tolerates both a spoken currency word and
      # speech-to-text mishearing "pounds" as the weight unit "lbs" - without
      # it, that extra word breaks the match entirely since it's neither
      # part of the {amount} slot nor the literal "to pocket money" text.
      - sentences:
          - "add {amount} [(pounds|pound|lbs|quid)] to pocket money"
          - "add {amount} [(pounds|pound|lbs|quid)] to pocket money for {reason}"
          - "add {amount} (pounds|pound) {pence} (pence|p) to pocket money"
          - "add {amount} (pounds|pound) {pence} (pence|p) to pocket money for {reason}"
          - "add {pence} (pence|p) to pocket money"
          - "add {pence} (pence|p) to pocket money for {reason}"
          - "add {amount} to {name}'s pocket money"
          - "add {amount} to {name}'s pocket money for {reason}"
          - "credit {amount} [(pounds|pound|lbs|quid)] to pocket money"
          - "credit {amount} [(pounds|pound|lbs|quid)] to pocket money for {reason}"
          - "credit {amount} (pounds|pound) {pence} (pence|p) to pocket money"
          - "credit {amount} (pounds|pound) {pence} (pence|p) to pocket money for {reason}"
          - "credit {pence} (pence|p) to pocket money"
          - "credit {pence} (pence|p) to pocket money for {reason}"
          - "credit {amount} to {name}'s pocket money"
          - "credit {amount} to {name}'s pocket money for {reason}"

  PocketMoneyRemoveFunds:
    data:
      # All accepted verbs folded into one alternation rather than repeating
      # every pattern per-verb - remove/take/deduct/subtract/spend all mean
      # the same thing here.
      - sentences:
          - "(remove|take|deduct|subtract|spend) {amount} [(pounds|pound|lbs|quid)] from pocket money"
          - "(remove|take|deduct|subtract|spend) {amount} [(pounds|pound|lbs|quid)] from pocket money for {reason}"
          - "(remove|take|deduct|subtract|spend) {amount} (pounds|pound) {pence} (pence|p) from pocket money"
          - "(remove|take|deduct|subtract|spend) {amount} (pounds|pound) {pence} (pence|p) from pocket money for {reason}"
          - "(remove|take|deduct|subtract|spend) {pence} (pence|p) from pocket money"
          - "(remove|take|deduct|subtract|spend) {pence} (pence|p) from pocket money for {reason}"
          - "(remove|take|deduct|subtract|spend) {amount} from {name}'s pocket money"
          - "(remove|take|deduct|subtract|spend) {amount} from {name}'s pocket money for {reason}"

  PocketMoneyGetBalance:
    data:
      - sentences:
          - "what is the pocket money balance"
          - "what's the pocket money balance"
          - "how much pocket money is there"
          - "pocket money balance"
          - "what is {name}'s pocket money balance"
          - "what's {name}'s pocket money balance"
          - "how much pocket money does {name} have"
          - "{name}'s pocket money balance"

lists:
  amount:
    range:
      from: 0
      to: 1000
  pence:
    range:
      from: 0
      to: 99
  reason:
    wildcard: true
  name:
    wildcard: true
